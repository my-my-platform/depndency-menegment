name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    uses: my-my-platform/platform/.github/workflows/maven-ci.yml@main
    with:
      deploy: true
    secrets: inherit

  trigger-renovate:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, java]
    steps:
      - name: Debug token
        run: echo "token length=${#TOKEN}"
        env:
          TOKEN: ${{ secrets.RENOVAT_TOKEN }}

      - name: Run Renovate in platform
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.RENOVATE_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/my-my-platform/platform/actions/workflows/renovate.yml/dispatches \
            -d '{"ref":"main"}'
