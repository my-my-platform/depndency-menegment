name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    uses: my-my-platform/platform/.github/workflows/maven-ci.yml@main
    with:
      deploy: true
    secrets: inherit

  trigger-renovate:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, java]
    steps:
      - name: Check token
        run: |
          echo "prefix=${TOKEN:0:4} length=${#TOKEN}"
          echo "hash=$(printf '%s' "$TOKEN" | sha256sum | cut -c1-12)"
          curl -s -o /dev/null -w "github api status=%{http_code}\n" -H "Authorization: Bearer $TOKEN" https://api.github.com/user
        env:
          TOKEN: ${{ secrets.RENOVATE_TOKEN }}

      - name: Run Renovate in platform
        run: curl -sS -X POST -w "\nstatus=%{http_code}\n" -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" -d '{"ref":"main"}' https://api.github.com/repos/my-my-platform/platform/actions/workflows/renovate.yml/dispatches
        env:
          TOKEN: ${{ secrets.RENOVATE_TOKEN }}
